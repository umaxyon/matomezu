<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>relay-log</title>
<style>
  :root { --bg:#fff; --fg:#1f2328; --muted:#6a737d; --line:#d8dee4; --hover:#f3f6f9; --open:#eef4ff; --warn:#b35900; --err:#c62828; --code:#f6f8fa; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181d; --fg:#d7dde3; --muted:#8b949e; --line:#2d333b; --hover:#1c2128; --open:#18263a; --warn:#e0a040; --err:#ef7070; --code:#1c2128; }
  }
  body { margin:0; background:var(--bg); color:var(--fg); font:13px/1.5 ui-monospace,Menlo,Consolas,monospace; }
  header { display:flex; gap:16px; align-items:center; padding:8px 16px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:1; }
  header b { font-size:14px; } header span { color:var(--muted); } a { color:inherit; }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:3px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:normal; }
  td.n, th.n { text-align:right; }
  tr.row { cursor:pointer; } tr.row:hover { background:var(--hover); } tr.row.open { background:var(--open); }
  .warn { color:var(--warn); } .err { color:var(--err); } .muted { color:var(--muted); }
  td.detail { white-space:normal; padding:8px 16px 16px 36px; background:var(--bg); }
  h4 { margin:14px 0 4px; font-size:13px; }
  pre { margin:2px 0; padding:6px 8px; background:var(--code); border:1px solid var(--line); border-radius:4px; white-space:pre-wrap; word-break:break-all; max-height:420px; overflow:auto; }
  details { margin:2px 0; } summary { cursor:pointer; }
  dl { display:grid; grid-template-columns:max-content 1fr; gap:0 16px; margin:4px 0; } dt { color:var(--muted); } dd { margin:0; }
</style>
</head>
<body>
<header><b>relay-log</b><select id="session"><option value="">全セッション</option></select><span id="count"></span><span id="auto">3 秒ごとに読み直す</span><a href="/mcp">matomezu の結果のランキング</a></header>
<table>
  <thead><tr>
    <th class="n">#</th><th>セッション</th><th>時刻</th><th>流れ</th><th>model</th><th class="n">msgs</th><th class="n">input</th>
    <th class="n">cache_read</th><th class="n">cache_new</th><th class="n">output</th><th>食い違い</th>
    <th class="n">新しい結果(字)</th><th class="n">ms</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
const num = n => n === undefined ? "-" : n.toLocaleString("en-US")
const el = (tag, props = {}, ...kids) => {
  const e = Object.assign(document.createElement(tag), props)
  for (const k of kids) e.append(k)
  return e
}
const open = new Set()
let entries = []

async function get(path) { return (await fetch(path)).json() }

function cell(text, cls = "") { return el("td", { className: cls, textContent: text }) }

function renderRows() {
  const tbody = document.getElementById("rows")
  tbody.replaceChildren()
  for (const e of entries) {
    const u = e.usage, s = e.summary
    const tr = el("tr", { className: "row" + (open.has(e.id) ? " open" : "") })
    tr.append(
      cell(e.id, "n"), cell(e.session), cell(new Date(e.at).toLocaleTimeString()), cell(e.stream, "muted"), cell(s.model),
      cell(s.messages, "n"), cell(num(u.input_tokens), "n"), cell(num(u.cache_read_input_tokens), "n"),
      cell(num(u.cache_creation_input_tokens), "n"), cell(num(u.output_tokens), "n"),
      e.probe ? cell(`${e.probe} の確かめ（${e.status}）`, "muted")
        : e.status >= 400 ? cell("status " + e.status, "err")
        : e.aborted ? cell("中断", "warn") : cell(e.diverge, e.diverge === "none" ? "muted" : "warn"),
      cell(num(e.newResults.reduce((n, r) => n + r.chars, 0)), "n"), cell(num(e.ms), "n"),
    )
    tr.onclick = () => { open.has(e.id) ? open.delete(e.id) : open.add(e.id); renderRows() }
    tbody.append(tr)
    if (open.has(e.id)) tbody.append(detailRow(e))
  }
  document.getElementById("count").textContent = entries.length + " 件"
}

function detailRow(e) {
  const td = el("td", { className: "detail", colSpan: 13 })
  td.append(summary(e))
  const req = el("div", {}, el("span", { className: "muted", textContent: "読み込み中…" }))
  const res = el("div")
  td.append(req, res)
  get("/api/parts/" + e.id).then(r => fillRequest(req, r))
  get("/api/res/" + e.id).then(r => fillReply(res, r))
  return el("tr", {}, td)
}

function summary(e) {
  const s = e.summary, dl = el("dl")
  const rows = [
    ["system", num(s.systemChars) + " 字"],
    ["ツールの説明", `${s.toolsN} 個 ${num(s.toolsChars)} 字（matomezu ${s.matomezuToolsN} 個 ${num(s.matomezuToolsChars)} 字）`],
    ["会話の文", num(s.textChars) + " 字"],
    ["結果", `${num(s.resultChars)} 字（matomezu ${num(s.matomezuResultChars)} 字）`],
    ["cache_control", s.marks.join(" ") || "なし"],
    ["新しい結果", e.newResults.map(r => `${r.tool} ${num(r.chars)} 字`).join("、") || "なし"],
  ]
  if (e.error) rows.push(["error", e.error])
  for (const [k, v] of rows) dl.append(el("dt", { textContent: k }), el("dd", { textContent: v }))
  return dl
}

function fillRequest(box, r) {
  box.replaceChildren()
  if (!r) {
    box.append(el("div", { className: "muted", textContent: "中身は --full で記録したときだけ見える" }))
    return
  }
  const hidden = new Set(r.hidden)
  box.append(el("h4", { textContent: "由来ごとの字数" }))
  const all = r.totals.reduce((n, t) => n + t.chars, 0)
  const dl = el("dl")
  for (const t of r.totals) {
    dl.append(
      el("dt", { textContent: t.group + (hidden.has(t.group) ? "（隠せる）" : "") }),
      el("dd", { textContent: `${num(t.chars)} 字（${Math.round((t.chars / all) * 100)}%）` }),
    )
  }
  box.append(dl)
  const toggle = el("input", { type: "checkbox", checked: loadHide() })
  const list = el("div")
  const draw = () => {
    list.replaceChildren()
    for (const p of r.parts) {
      if (toggle.checked && hidden.has(p.group)) continue
      const d = details(`${p.where} ${p.label}`, p.text, ` [${p.group}] ${num(p.chars)} 字`)
      list.append(d)
    }
  }
  toggle.onchange = () => { saveHide(toggle.checked); draw() }
  box.append(el("h4", { textContent: "リクエストの中身" }), el("label", {}, toggle, " 直せる所だけ見る（" + r.hidden.join("・") + " を隠す）"), list)
  draw()
}

function loadHide() { try { return localStorage.getItem("hideFixed") !== "0" } catch { return true } }
function saveHide(on) { try { localStorage.setItem("hideFixed", on ? "1" : "0") } catch {} }

function fillReply(box, blocks) {
  box.replaceChildren()
  if (!blocks) return
  box.append(el("h4", { textContent: "モデルの返答" }))
  for (const b of blocks) {
    const d = details(b.type === "tool_use" ? "tool_use " + b.name : b.type, b.type === "tool_use" ? b.input : b.text)
    d.open = true
    box.append(d)
  }
}

function details(title, text, tail) {
  return el("details", {}, el("summary", { textContent: tail ? title + tail : `${title}（${num(text.length)} 字）` }), el("pre", { textContent: text }))
}

async function load() {
  const select = document.getElementById("session")
  const sessions = await get("/api/sessions")
  const names = ["", ...sessions.map(s => s.session)]
  if (names.join("\n") !== [...select.options].map(o => o.value).join("\n")) {
    const current = select.value
    select.replaceChildren(...names.map(n => el("option", { value: n, textContent: n ? `${n}（${sessions.find(s => s.session === n).n}）` : "全セッション" })))
    select.value = names.includes(current) ? current : ""
  }
  const next = await get("/api/entries" + (select.value ? "?session=" + encodeURIComponent(select.value) : ""))
  if (next.length !== entries.length || next.at(-1)?.id !== entries.at(-1)?.id) { entries = next; renderRows() }
}
document.getElementById("session").onchange = () => { entries = []; load() }
load()
setInterval(load, 3000)
</script>
</body>
</html>
