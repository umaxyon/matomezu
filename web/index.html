<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>matomezu</title>
<style>
  :root {
    --bg: #1e1e1e;
    --grid: rgba(255, 255, 255, 0.035);
    --text: #e4e4e7;
    --hint: rgba(220, 220, 230, 0.55);
    --bar: #252526;
    --bar-border: rgba(255, 255, 255, 0.08);
    --btn: #3a3a3f;
    --btn-hover: #4a4a50;
    --accent: #8b6cf0;
    --error: #f87171;
    --scroll: rgba(255, 255, 255, 0.2);
    --scroll-hover: rgba(255, 255, 255, 0.36);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f6f8;
      --grid: rgba(0, 0, 0, 0.045);
      --text: #1b1b1f;
      --hint: rgba(40, 40, 50, 0.55);
      --bar: #ffffff;
      --bar-border: rgba(0, 0, 0, 0.1);
      --btn: #ececf0;
      --btn-hover: #dedee4;
      --accent: #6d4bd8;
      --error: #dc2626;
      --scroll: rgba(0, 0, 0, 0.2);
      --scroll-hover: rgba(0, 0, 0, 0.36);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--bar);
    border-bottom: 1px solid var(--bar-border);
    font-size: 13px;
    flex-wrap: wrap;
  }
  header .name { opacity: 0.8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .status { margin-right: auto; color: var(--hint); font-size: 12px; }
  /* サーバーから開いたときは自動で保存するので、開く・保存のボタンは使わない。図の名前はタブに出す */
  body.served #open, body.served #save, body.served #name { display: none; }
  /* アプリ内のタブ（サーバーから開いたときだけ） */
  .tabs {
    display: flex;
    gap: 2px;
    padding: 4px 8px 0;
    background: var(--bar);
    border-bottom: 1px solid var(--bar-border);
    overflow-x: auto;
    font-size: 13px;
  }
  .tabs[hidden] { display: none; }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: 240px;
    padding: 5px 6px 5px 12px;
    border: 1px solid transparent;
    border-bottom: 0;
    border-radius: 6px 6px 0 0;
    color: var(--hint);
    cursor: pointer;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text); background: var(--btn); }
  .tab[aria-selected="true"] { color: var(--text); background: var(--bg); border-color: var(--bar-border); }
  .tab-name { overflow: hidden; text-overflow: ellipsis; }
  /* ブックごとのタブグループ。左端の色の印でブックを見分ける。先頭のタブ（ブックの名前）が最初のページ */
  .tab-group { display: flex; gap: 2px; padding-left: 6px; margin-right: 8px; border-left: 3px solid var(--book, var(--accent)); }
  .tab-book .tab-name { font-weight: 600; }
  /* 付け替えのドラッグで乗っているタブ（少し止めるとそのページに切り替わる） */
  .tab.tab-drop { color: var(--text); background: var(--btn-hover); outline: 2px dashed var(--accent); outline-offset: -2px; }
  .tab-close { padding: 0 5px; border: 0; background: transparent; line-height: 1.4; color: inherit; opacity: 0.6; }
  .tab-close:hover { opacity: 1; background: var(--btn-hover); }
  button {
    font: inherit;
    color: inherit;
    background: var(--btn);
    border: 1px solid var(--bar-border);
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:hover { background: var(--btn-hover); }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  button.primary:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.4; cursor: default; }
  button:disabled:hover { background: var(--btn); }
  .toolbar { display: flex; gap: 4px; padding-right: 10px; margin-right: 2px; border-right: 1px solid var(--bar-border); }
  .icon-btn { padding: 5px; line-height: 0; }
  .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: transparent; }
  .toolbar .sep { width: 1px; margin: 2px 4px; background: var(--bar-border); }
  /* モードを切り替えて文字数が変わっても右の線モードのボタンが動かないよう、一番長い「付け替えモード」の幅に固定する */
  .mode-label { align-self: center; margin-left: 4px; width: 7em; font-size: 12px; color: var(--hint); white-space: nowrap; }
  main { flex: 1; display: flex; min-height: 0; }
  #sidebar {
    width: 280px;
    flex: none;
    overflow-y: auto;
    background: var(--bar);
    border-right: 1px solid var(--bar-border);
  }
  /* スクロールバー: 細い角丸のつまみだけを見せ、通り道は透明にする。乗せると太く濃くなる。
     Chrome・Edge・Safari は ::-webkit-scrollbar で形を作る（scrollbar-width / scrollbar-color を指定すると
     Chrome はこちらを無視するので、それらは ::-webkit-scrollbar が使えない Firefox だけに当てる） */
  #sidebar::-webkit-scrollbar { width: 12px; height: 12px; }
  #sidebar::-webkit-scrollbar-track, #sidebar::-webkit-scrollbar-corner { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb {
    background: var(--scroll); border-radius: 6px;
    border: 3px solid transparent; background-clip: padding-box;
  }
  #sidebar::-webkit-scrollbar-thumb:hover { background-color: var(--scroll-hover); border-width: 2px; }
  @supports not selector(::-webkit-scrollbar) {
    #sidebar { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
  }
  /* ワールドの列。タブはワールドの上だけに出す（サイドバーの上には出さない） */
  .work { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .canvas { position: relative; flex: 1; min-width: 0; min-height: 0; }
  /* 図の側の .mz-stage（position: relative）より強くする */
  #stage, .canvas > .stage {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(var(--grid) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .canvas > .stage[hidden], .side-pane[hidden] { display: none; }
  #stage.dropping { outline: 2px dashed var(--accent); outline-offset: -8px; }
  .hint {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 12px;
    font-size: 12px;
    color: var(--hint);
    pointer-events: none;
  }
  .hint.error { color: var(--error); }
  @media (max-width: 640px) {
    main { flex-direction: column-reverse; }
    #sidebar { width: auto; max-height: 40vh; border-right: 0; border-top: 1px solid var(--bar-border); }
  }
</style>
</head>
<body>
<header>
  <div class="toolbar" role="toolbar" aria-label="ツールバー">
    <button id="undo" class="icon-btn" title="元に戻す (Ctrl+Z)" aria-label="元に戻す" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button id="redo" class="icon-btn" title="やり直す (Ctrl+Shift+Z)" aria-label="やり直す" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <button id="mode-move" class="icon-btn" data-mode="move" title="選択モード: クリックでボックスや線を選ぶ / ドラッグでボックスを動かす" aria-label="選択モード" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M2 12h20"/><path d="m9 5 3-3 3 3M9 19l3 3 3-3M5 9l-3 3 3 3M19 9l3 3-3 3"/></svg>
    </button>
    <button id="mode-reparent" class="icon-btn" data-mode="reparent" title="付け替えモード: ドラッグして落とした先のボックスの子にする" aria-label="付け替えモード" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h5a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-5"/><path d="M3 12h12"/><path d="m11 8 4 4-4 4"/></svg>
    </button>
    <span class="mode-label" id="mode-label" aria-live="polite">選択モード</span>
    <span class="sep" aria-hidden="true"></span>
    <button id="mode-link" class="icon-btn" data-mode="link" title="線モード: Ctrl+クリックで同じ階層の2つを選ぶと線を追加（Esc で取り消し）。線を選ぶ・消すのは選択モードで" aria-label="線モード" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="5.5" r="2.5"/><path d="M7.5 16.5l9-9"/></svg>
    </button>
    <button id="mode-remove" class="icon-btn" data-mode="remove" title="削除モード: ボックスを押すと子も一緒に消える（消したものはサイドバーの「追加削除」から戻せる）" aria-label="削除モード" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/></svg>
    </button>
  </div>
  <span class="name" id="name">サンプル</span>
  <span class="status" id="status" role="status"></span>
  <button id="open">JSONを開く</button>
  <button id="save" class="primary">保存</button>
  <input id="file" type="file" accept="application/json,.json" hidden>
</header>
<main>
  <aside id="sidebar"></aside>
  <div class="work">
    <nav class="tabs" id="tabs" role="tablist" aria-label="開いている図" hidden></nav>
    <div class="canvas">
      <div id="stage"></div>
      <div class="hint" id="hint">クリックでボックスや線を選択 / ドラッグで移動 / 線の追加は線モードで / JSON はドロップでも開けます</div>
    </div>
  </div>
</main>

<!-- 最初に表示するデータ。?src=xxx.json を付けて開くとそちらを読む（http で配信しているときのみ） -->
<script type="application/json" id="initial-data">
{
  "nodes": [
    { "id": 1, "caption": "Blue", "color": "#3b82f6" },
    { "id": 2, "caption": "Warm", "color": "#f97316" },
    { "id": 3, "caption": "Yellow", "color": "#eab308", "parent": 2 },
    { "id": 4, "caption": "Orange", "color": "#f97316", "parent": 2 },
    { "id": 5, "caption": "Red", "color": "#ef4444", "parent": 2 },
    { "id": 6, "caption": "Green", "color": "#22c55e" },
    { "id": 7, "caption": "透明・枠線なしのボックス", "fill": false, "border": false, "x": 24, "y": 24, "width": 200 }
  ],
  "edges": [
    { "id": "e1", "from": 1, "to": 6 },
    { "id": "e2", "from": 1, "to": 2 },
    { "id": "e3", "from": 6, "to": 2 }
  ]
}
</script>
<script src="dist/matomezu.js"></script>
</body>
</html>
