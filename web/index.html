<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>matomezu</title>
<style>
  :root {
    --bg: #1e1e1e;
    --grid: rgba(255, 255, 255, 0.035);
    --text: #e4e4e7;
    --hint: rgba(220, 220, 230, 0.55);
    --bar: #252526;
    --tools: #34343a;
    --bar-border: rgba(255, 255, 255, 0.08);
    --btn: #3a3a3f;
    --btn-hover: #4a4a50;
    --accent: #8b6cf0;
    --error: #f87171;
    --scroll: rgba(255, 255, 255, 0.2);
    --scroll-hover: rgba(255, 255, 255, 0.36);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f6f8;
      --grid: rgba(0, 0, 0, 0.045);
      --text: #1b1b1f;
      --hint: rgba(40, 40, 50, 0.55);
      --bar: #ffffff;
      --tools: #e6e6ec;
      --bar-border: rgba(0, 0, 0, 0.1);
      --btn: #ececf0;
      --btn-hover: #dedee4;
      --accent: #6d4bd8;
      --error: #dc2626;
      --scroll: rgba(0, 0, 0, 0.2);
      --scroll-hover: rgba(0, 0, 0, 0.36);
    }
  }
  /* 同梱のフォント（D44 の 4.2）: どの画面でも同じフォントで描いて測る（環境で文字の幅が変わらない）。太さは 100〜900 を 1 つのファイルで持つ。
     フォントに無い文字（絵文字など）だけ OS のフォントで描く */
  @font-face {
    font-family: "matomezu Noto Sans JP";
    src: url("fonts/NotoSansJP-VF.woff2") format("woff2");
    font-weight: 100 900;
    font-display: block;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font-family: "matomezu Noto Sans JP", "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
  }
  /* ボタンやタブの文字は、ドラッグしたときに選択されないようにする（入力欄はそのまま選べる） */
  .tab-bar, button, .mzp-tabs, .mzp-seg label { user-select: none; -webkit-user-select: none; }
  /* ヘッダーは無い（D26。docs/UI-plan.md）。一番上のタブ行に、左から道具・タブ・右端の群を置く。道具と右端の群はタブと背景の色で分ける */
  .tab-bar {
    position: relative;
    display: flex;
    align-items: stretch;
    background: var(--bar);
    border-bottom: 1px solid var(--bar-border);
    font-size: 13px;
    min-height: 40px;
  }
  .toolbar, .tab-right { flex: none; display: flex; align-items: center; gap: 2px; padding: 0 6px; background: var(--tools); }
  .toolbar { border-right: 1px solid var(--bar-border); }
  .tab-right { border-left: 1px solid var(--bar-border); }
  .toolbar .sep, .tab-right .sep { width: 1px; height: 22px; margin: 0 4px; background: var(--bar-border); }
  /* サーバーから開いたときは自動で保存するので、開く・保存のボタンは使わない。図の名前はタブに出す */
  body.served #open, body.served #save, body.served #name, body.served .file-sep { display: none; }
  /* マスター（D26 の段階 2）はサーバーから開いたときだけ。設定はマスターの道具箱から開くので、歯車はサーバーなしのときだけ */
  body:not(.served) #master, body:not(.served) .master-sep, body.served #settings, body.served .settings-sep { display: none; }
  /* タブは今のブックだけを見せる。マスターでは、ブックの道具（ブック・追加削除）を隠し、マスターのタブは閉じられない */
  .tab-group:not(.tab-group-current) { display: none; }
  body.master #book, body.master #side-toggle, .tab-group-master .tab-close, .tab-group-master .tab-add { display: none; }
  /* プレビュー（見るだけ。preview.ts）: 倍率の操作を出し、サイドバー・編集の道具・全体像は隠す */
  .zoom { display: flex; align-items: center; gap: 2px; }
  body.previewing #zoom-home { display: none; } /* プレビューは「全体」で戻す */
  body:not(.previewing) #zoom-fit { display: none; } /* 編集中の倍率は 75% / 100% / 125% の段だけ（D32）。「全体」はプレビューだけ */
  .zoom-level { min-width: 3.5em; text-align: center; font-size: 12px; color: var(--hint); }
  body.previewing #sidebar, body.previewing .toolbar, body.previewing #minimap-toggle, body.previewing .mz-minimap,
  body.previewing .mz-toolbox { display: none; }
  /* プレビューでは、ページを足す＋と閉じる × を隠す（D26） */
  body.previewing .tab-add, body.previewing .tab-close { display: none; }
  /* タブの列 */
  .tabs {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: flex-end;
    gap: 2px;
    padding: 4px 8px 0;
    overflow-x: auto;
  }
  /* はみ出したタブがある側の端をぼかす（tab-scroll.ts。G5） */
  .tabs.fade-left { mask-image: linear-gradient(to right, transparent 0, #000 28px); }
  .tabs.fade-right { mask-image: linear-gradient(to left, transparent 0, #000 28px); }
  .tabs.fade-left.fade-right { mask-image: linear-gradient(to right, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%); }
  .tab {
    display: flex;
    align-items: center;
    gap: 6px;
    max-width: 240px;
    padding: 5px 6px 5px 12px;
    border: 1px solid transparent;
    border-bottom: 0;
    border-radius: 6px 6px 0 0;
    color: var(--hint);
    cursor: pointer;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text); background: var(--btn); }
  .tab[aria-selected="true"] { color: var(--text); background: var(--bg); border-color: var(--bar-border); }
  .tab-name { overflow: hidden; text-overflow: ellipsis; }
  /* サーバーなしで開いたときの図の名前（タブの形で出す。閉じたり切り替えたりはしない） */
  #name { padding-right: 12px; cursor: default; }
  /* ブックごとのタブグループ。左端の色の印でブックを見分ける。先頭のタブ（ブックの名前）が最初のページ */
  .tab-group { display: flex; align-items: flex-end; gap: 2px; padding-left: 6px; margin-right: 8px; border-left: 3px solid var(--book, var(--accent)); align-self: stretch; }
  .tab-book .tab-name { font-weight: 600; }
  /* タブグループの右端の小さな＋（ページを足す。app.ts） */
  .tab-add { align-self: center; margin-left: 2px; padding: 3px; border: 0; border-radius: 6px; background: transparent; color: var(--hint); line-height: 0; }
  .tab-add svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; }
  .tab-add:hover { color: var(--text); background: var(--btn-hover); }
  /* 付け替えのドラッグで乗っているタブ（少し止めるとそのページに切り替わる） */
  .tab-group-dragging { opacity: 0.6; }
  .tab-group-dragging .tab { cursor: grabbing; }
  .tab.tab-drop { color: var(--text); background: var(--btn-hover); outline: 2px dashed var(--accent); outline-offset: -2px; }
  /* ページのタブを図へドラッグしている間（リンクの箱を作る。D29）: 文字を選ばない */
  body.tab-dragging, body.tab-dragging * { cursor: grabbing !important; user-select: none; }
  .tab-close { padding: 0 5px; border: 0; background: transparent; line-height: 1.4; color: inherit; opacity: 0.6; }
  .tab-close:hover { opacity: 1; background: var(--btn-hover); }
  button {
    font: inherit;
    color: inherit;
    background: var(--btn);
    border: 1px solid var(--bar-border);
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
  }
  button:hover { background: var(--btn-hover); }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  button.primary:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.4; cursor: default; }
  button:disabled:hover { background: var(--btn); }
  .icon-btn { padding: 6px; line-height: 0; border-color: transparent; background: transparent; }
  .icon-btn:hover { background: var(--btn-hover); }
  .icon-btn:disabled:hover { background: transparent; }
  .icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: transparent; }
  /* モードのボタン（D39。mode-wheel.ts）: 今のモードを手前に、残りを左右の後ろに小さく薄く控えさせ、変わると輪を回す */
  /* 背景は開いているタブと同じ色で、タブ行のほかの所と分ける（色は変数にして、後でスキンで変えられるように） */
  #mode-tool.mode-wheel { --wheel-bg: var(--bg); --wheel-hover: var(--btn); --wheel-fg: var(--text);
    position: relative; width: 60px; height: 32px; padding: 0; background: var(--wheel-bg); color: var(--wheel-fg); }
  #mode-tool.mode-wheel:hover { background: var(--wheel-hover); }
  /* 手前の絵の下に敷く薄い色の丸（後ろの控えより前、手前の絵より後ろ） */
  #mode-tool.mode-wheel::before { content: ""; position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%;
    background: color-mix(in srgb, var(--accent) 42%, transparent); z-index: 6; pointer-events: none; }
  .mode-wheel-icon { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; line-height: 0; pointer-events: none; }
  .mode-wheel-icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* 今のモードの札（選択モード以外のときだけ、図の上の真ん中に出す。toolbar.ts の setupModes） */
  .mode-label {
    position: absolute; left: 50%; top: 10px; z-index: 30; transform: translateX(-50%);
    padding: 3px 12px; border-radius: 14px; background: var(--accent); color: #fff; font-size: 12px; white-space: nowrap; pointer-events: none;
  }
  .mode-label[data-mode="move"] { display: none; }
  body.previewing .mode-label { display: none; }
  /* 開いている図が無いときの案内（図の真ん中） */
  .empty { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; padding: 16px; color: var(--hint); text-align: center; pointer-events: none; }
  .empty[hidden] { display: none; }
  main { position: relative; flex: 1; display: flex; min-height: 0; }
  /* サイドバー（追加削除の一覧・郵便箱）はふだん隠し、タブ行のボタンで左から出す（D26）。図の上にかぶせるドロワーで、図の枠は押さない（E22。2026-10-18 ユーザー）。
     開いている間は、図の左の余白をドロワーの幅だけ広げる（graph.setInset。幅はここの width を測って渡す） */
  #sidebar { display: none; }
  body.side-open:not(.previewing) #sidebar { display: block; }
  /* サイドバーは、追加削除の一覧（ブックごとの .side-pane）か郵便箱（#mailbox）のどちらか 1 つを見せる（body の data-side。D26 の段階 3） */
  body[data-side="mail"] #sidebar > .side-pane, body[data-side="cross"] #sidebar > .side-pane,
  body:not([data-side="mail"]) #mailbox, body:not([data-side="cross"]) #crossmove { display: none; }
  /* マスターの追加削除で、行を運んでいる窓（離すとそのブックの郵便箱へ送る） */
  .mz-node.mz-mail-drop > .mz-head { outline: 2px dashed var(--accent); outline-offset: 2px; }
  /* 郵便箱の未読の数（99 を超えたら 99+） */
  .icon-btn { position: relative; }
  .badge { position: absolute; right: -3px; top: -3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: #ef4444; color: #fff;
    font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; pointer-events: none; }
  .badge:empty { display: none; }
  body:not(.served) #mail-toggle { display: none; }
  /* AI の問いのパレット（D36。app-ask.ts）: タブ行の真ん中に重ねる。押すとその問いへスクロール。答えたものは線で消す、ドロワーの問いは点線 */
  .ask-palette { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3; display: flex; align-items: center; gap: 4px;
    padding: 3px 4px 3px 10px; border-radius: 16px; border: 1px solid var(--ask); background: color-mix(in srgb, var(--ask) 12%, var(--bar)); font-size: 12px; white-space: nowrap; }
  .ask-palette[hidden] { display: none; }
  .ask-palette .ask-label { font-weight: 600; margin-right: 2px; }
  .ask-palette .ask-count { opacity: 0.7; margin-right: 4px; font-variant-numeric: tabular-nums; }
  .ask-palette button { font: inherit; font-weight: 700; min-width: 26px; height: 24px; padding: 0 6px; border-radius: 12px; border: 1px solid var(--ask);
    background: var(--bar); color: var(--ask); cursor: pointer; }
  .ask-palette button.ask-done { border-color: var(--bar-border); color: var(--hint); background: transparent; text-decoration: line-through; }
  .ask-palette button.ask-drawer { border-style: dashed; }
  .ask-palette button.ask-end { margin-left: 4px; font-weight: 500; border-color: var(--bar-border); color: inherit; }
  #sidebar {
    position: absolute; left: 0; top: 0; bottom: 0; z-index: 40;
    width: 340px; max-width: 100%; box-sizing: border-box;
    overflow-y: auto;
    background: var(--bar);
    border-right: 1px solid var(--bar-border);
    box-shadow: 6px 0 20px rgba(0, 0, 0, 0.12);
  }
  /* スクロールバー: 細い角丸のつまみだけを見せ、通り道は透明にする。乗せると太く濃くなる。
     Chrome・Edge・Safari は ::-webkit-scrollbar で形を作る（scrollbar-width / scrollbar-color を指定すると
     Chrome はこちらを無視するので、それらは ::-webkit-scrollbar が使えない Firefox だけに当てる） */
  /* タブ列（横スクロール）も同じ形にする（2026-10-11 ユーザー。既定の白い通り道と矢印が暗いテーマで浮いていた） */
  #sidebar::-webkit-scrollbar { width: 12px; height: 12px; }
  .tabs::-webkit-scrollbar { height: 8px; } /* タブ列は細め（サイドバーの 2/3。2026-10-17 ユーザー） */
  #sidebar::-webkit-scrollbar-track, #sidebar::-webkit-scrollbar-corner,
  .tabs::-webkit-scrollbar-track, .tabs::-webkit-scrollbar-corner { background: transparent; }
  #sidebar::-webkit-scrollbar-button, .tabs::-webkit-scrollbar-button { display: none; }
  #sidebar::-webkit-scrollbar-thumb, .tabs::-webkit-scrollbar-thumb {
    background: var(--scroll); border-radius: 6px;
    border: 3px solid transparent; background-clip: padding-box;
  }
  #sidebar::-webkit-scrollbar-thumb:hover, .tabs::-webkit-scrollbar-thumb:hover { background-color: var(--scroll-hover); border-width: 2px; }
  .tabs::-webkit-scrollbar-thumb { border-width: 2px; }
  .tabs::-webkit-scrollbar-thumb:hover { border-width: 1px; }
  @supports not selector(::-webkit-scrollbar) {
    #sidebar, .tabs { scrollbar-width: thin; scrollbar-color: var(--scroll) transparent; }
  }
  .canvas { position: relative; flex: 1; min-width: 0; min-height: 0; }
  /* 図の側の .mz-stage（position: relative）より強くする */
  #stage, .canvas > .stage {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(var(--grid) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .canvas > .stage[hidden], .side-pane[hidden] { display: none; }
  #stage.dropping { outline: 2px dashed var(--accent); outline-offset: -8px; }
  @media (max-width: 640px) {
    #sidebar { top: auto; right: 0; width: auto; max-height: 40vh; border-right: 0; border-top: 1px solid var(--bar-border); box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.12); }
  }
</style>
</head>
<body>
<div class="tab-bar" id="tab-bar">
  <div class="toolbar" role="toolbar" aria-label="ツールバー">
    <button id="master" class="icon-btn" title="マスター: ブックの一覧（新しい図・設定もここから）" aria-label="マスター" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </button>
    <span class="sep master-sep" aria-hidden="true"></span>
    <button id="undo" class="icon-btn" title="元に戻す (Ctrl+Z)" aria-label="元に戻す" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button id="redo" class="icon-btn" title="やり直す (Ctrl+Shift+Z)" aria-label="やり直す" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <button id="book" class="icon-btn" title="ブック: ブックとページの設定" aria-label="ブック">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M8 7h7"/></svg>
    </button>
    <button id="side-toggle" class="icon-btn" title="追加削除: 箱の一覧を左に出す・隠す（消したものを図へドラッグすると戻る）" aria-label="追加削除" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18"/><path d="M5 7l1.5 13h11L19 7"/><path d="M12 11v6M9 14h6"/></svg>
    </button>
    <button id="mail-toggle" class="icon-btn" title="郵便箱: 届いた箱・ブックを左に出す・隠す" aria-label="郵便箱" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13l3-8h12l3 8"/><path d="M3 13v6h18v-6h-5l-1.5 2.5h-5L8 13z"/></svg>
      <span class="badge" id="mail-badge"></span>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <!-- ツールのモード: 押すたびに 選択 → 付け替え → 手のひら → 選択 と回す。絵と説明は今のモード（toolbar.ts の setupModes） -->
    <button id="mode-tool" class="icon-btn" data-mode="move" title="選択モード" aria-label="選択モード">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.35 3v16l4.5-4.2 3 6.7 2.6-1.2-3-6.6h5.9z"/></svg>
    </button>
  </div>
  <div class="ask-palette" id="ask-palette" role="toolbar" aria-label="AI の問い" hidden></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="開いている図">
    <div class="tab tab-book" id="name" aria-selected="true"><span class="tab-name">サンプル</span></div>
  </nav>
  <div class="tab-right">
    <div class="zoom" role="group" aria-label="倍率">
      <button id="zoom-out" class="icon-btn" title="縮小（Ctrl+ホイールでも）" aria-label="縮小">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
      </button>
      <span class="zoom-level" id="zoom-level"></span>
      <button id="zoom-in" class="icon-btn" title="拡大（Ctrl+ホイールでも）" aria-label="拡大">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button id="zoom-home" class="icon-btn" title="初めの位置に戻す（倍率も 100% に。Home キーでも）" aria-label="初めの位置に戻す">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7M6 9.5V20h12V9.5"/></svg>
      </button>
      <button id="zoom-fit" class="icon-btn" title="全体を収める" aria-label="全体を収める">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
    <button id="preview-toggle" class="icon-btn" disabled title="プレビュー: 拡大縮小して見る（見るだけ。押すと選べる。背景のドラッグで移動。Esc か、もう一度押すと編集に戻る）" aria-label="プレビュー" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <!-- 全体像（ミニマップ）は図の右上に出るので、ボタンもタブ行の右端に置く -->
    <button id="minimap-toggle" class="icon-btn" disabled title="全体像（ミニマップ）: 図の右上に全体を出す。四角をドラッグすると見る範囲が動く（図が画面に収まっているときは使えない）" aria-label="全体像" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="12" y="7" width="6" height="5" rx="1"/></svg>
    </button>
    <!-- サーバーなしで開いたときだけ使う、JSON を開く・保存（仮の置き場所。ファイルの扱いは別の課題。docs/UI-plan.md） -->
    <span class="sep file-sep" aria-hidden="true"></span>
